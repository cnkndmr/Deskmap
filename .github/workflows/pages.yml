name: Website

# Builds website/ + the Markdown docs with scripts/build-site.mjs and deploys
# website/_site to GitHub Pages. In the repository settings, Pages must use
# "GitHub Actions" as its source. For a custom domain later, set SITE_URL.
#
# Not used today: the site lives at https://cnkndmr.github.io/deskmap/, a
# folder of the cnkndmr.github.io repository, published by `make site-publish`
# (scripts/publish-site.sh). Pages is off for this repository, so the push
# trigger is disabled; run by hand only after turning Pages on here.

on:
  # push:
  #   branches: [ main ]
  #   paths:
  #     - 'website/**'
  #     - 'docs/**'
  #     - 'CHANGELOG.md'
  #     - 'VERSION'
  #     - 'scripts/build-site.mjs'
  #     - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    env:
      SITE_URL: https://cnkndmr.github.io/deskmap/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: each doc page shows its last change date

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pandoc
        # Same pandoc as the local build (3.2), not the older apt package, so
        # the --strict build sees the same HTML here as on a Mac.
        run: |
          curl -fsSL -o "$RUNNER_TEMP/pandoc.deb" https://github.com/jgm/pandoc/releases/download/3.2/pandoc-3.2-1-amd64.deb
          sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"
          pandoc --version | head -1

      - name: Build
        run: node scripts/build-site.mjs --strict

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/_site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
