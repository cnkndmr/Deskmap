name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Swift build and tests
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Build Swift package
        run: swift build --package-path app -c release

      - name: Unit tests
        run: swift test --package-path app

      - name: Build .app bundle
        run: ./scripts/build-app.sh release
