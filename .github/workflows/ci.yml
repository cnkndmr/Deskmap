name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: Swift derlemesi
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Swift paketi derlemesi
        run: swift build --package-path app -c release

      - name: .app paketi
        run: ./scripts/build-app.sh release
