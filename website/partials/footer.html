<!-- Cinematic site footer. Used by layout.html and by the bare home pages ({{site_footer}}). Styles: assets/cine.css (.site-foot). -->
<footer class="site-foot">
  <div class="wrap">
    <span>Deskmap v{{version}} · {{t.foot_license}}</span>
    <nav aria-label="{{t.foot_nav_label}}">
      <a href="{{root}}{{href.docs}}">{{t.nav_docs}}</a>
      <a href="{{root}}{{href.guide}}">{{t.foot_guide}}</a>
      <a href="{{root}}{{href.download}}">{{t.nav_download}}</a>
      <a href="{{root}}{{href.compare}}">{{t.nav_compare}}</a>
      <a href="{{root}}{{href.changelog}}">{{t.nav_changelog}}</a>
      <a href="{{root}}{{href.privacy}}">{{t.foot_privacy}}</a>
      <a href="{{repo_url}}">GitHub</a>
      <a href="{{repo_url}}/issues">{{t.foot_issue}}</a>
      <a href="{{paypal_url}}">{{t.foot_support}}</a>
      <a href="{{other_lang_href}}" hreflang="{{other_lang}}" lang="{{other_lang}}">{{t.other_lang_name}}</a>
    </nav>
  </div>
</footer>
