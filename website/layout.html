<!doctype html>
<!--
  Cinematic layout: every page of the Deskmap website except `layout: bare`
  (the home pages, which bring their own body but use the same header and
  footer partials) and `layout: legacy` (classic/ and motion/ home variants,
  website/layout-legacy.html). Head, header and footer come from
  website/partials/ so they cannot drift from the home page. Styles:
  assets/cine.css (component index at its top), behaviour: assets/cine.js.
  Page-specific CSS/JS: front matter `css:` / `js:`. Tokens: see the comment
  at the top of scripts/build-site.mjs. Never hard-code "/..." URLs here.
-->
<html lang="{{lang}}">
<head>
{{site_head}}<link rel="stylesheet" href="{{root}}assets/cine.css?v={{version}}">
{{extra_css}}<script src="{{root}}assets/cine.js?v={{version}}" defer></script>
</head>
<body class="{{body_class}}">
{{site_header}}

<main id="main">
{{content}}
</main>

{{site_footer}}
</body>
</html>
